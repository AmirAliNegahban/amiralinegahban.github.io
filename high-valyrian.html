layout: default
title: High Valyrian Translator
---

<h1>High Valyrian Translator<br><br></h1>
<textarea id="src" rows="8" cols="32" placeholder="..."></textarea>
<br>
<select id="dir">
  <option value="auto">Auto detect</option>
  <option value="en">English -> High Valyrian</option>
  <option value="hv">High Valyrian -> English</option>
</select>
<br>
<button id="go">Translate</button>
<button id="swap">Swap</button>
<button id="copy">Copy</button>
<button id="clear">Clear</button>

<p id="hint"></p>

<h2>Result</h2>
<pre id="out"></pre>
<pre id="align"></pre>

<hr>

<h2>Dictionary<br><br></h2>
<input id="dsearch" placeholder="Search...">
<table id="dtable" cellpadding="4" cellspacing="0"></table>

<hr>

<h2>Phrases and idioms<br><br></h2>
<input id="psearch" placeholder="Search...">
<table id="ptable" cellpadding="4" cellspacing="0"></table>

<hr>

<h2>Recognized High Valyrian forms<br><br></h2>
<input id="fsearch" placeholder="Search...">
<table id="ftable" cellpadding="4" cellspacing="0"></table>

<script type="module">
import * as Valyrian from "https://cdn.jsdelivr.net/gh/nxrix/high-valyrian-translator@4.0.1/valyrian.js";

let lastMode = "en";

const fill = (table, head, rows, search) => {
  const draw = () => {
    const q = search.value.trim().toLowerCase();
    table.innerHTML = "<tr>" + head.map(h => "<th>" + h + "</th>").join("") + "</tr>";
    for (const r of rows.filter(r => r.join(" ").toLowerCase().includes(q)).slice(0, 16)) {
      const row = table.insertRow(-1);
      r.forEach((c, i) => row.insertCell(i).textContent = c);
    }
    if (list.length > 16) table.insertRow(-1).insertCell(0).textContent = "...";
  };
  search.oninput = draw;
  draw();
};

const buildDict = () => {
  const rows = [];
  for (const en of Object.keys(Valyrian.D).sort()) {
    const e = Valyrian.D[en];
    rows.push([en, e[0], e[2] || "", Valyrian.KIND[e[1]] || e[1]]);
  }
  fill(dtable, ["English", "High Valyrian", "Plural", "Type"], rows, dsearch);
};

const buildPhrases = () => {
  const seen = new Set();
  const rows = [];
  for (const [en, hv] of Valyrian.P) {
    const key = en.toLowerCase() + "|" + hv.toLowerCase();
    if (seen.has(key)) continue;
    seen.add(key);
    rows.push([en, hv]);
  }
  fill(ptable, ["English", "High Valyrian"], rows, psearch);
};

const buildForms = () => {
  const seen = new Set();
  const rows = [];
  for (const k in Valyrian.PLX) {
    const d = Valyrian.de(k).toLowerCase();
    if (seen.has(d)) continue;
    seen.add(d);
    rows.push([k, Valyrian.PLX[k], "plural"]);
  }
  for (const k in Valyrian.F) {
    const d = Valyrian.de(k).toLowerCase();
    if (seen.has(d)) continue;
    seen.add(d);
    rows.push([k, Valyrian.F[k].en, (Valyrian.F[k].tags || "") + " of " + Valyrian.F[k].lemma]);
  }
  rows.sort((a, b) => a[0] < b[0] ? -1 : 1);
  fill(ftable, ["High Valyrian form", "Meaning", "Notes"], rows, fsearch);
};

const run = () => {
  const text = src.value;
  if (text.trim().length === 0) {
    out.textContent = "";
    align.textContent = "";
    hint.textContent = "";
    return;
  }
  const mode = dir.value === "auto" ? Valyrian.detect(text) : dir.value;
  lastMode = mode;
  const [translated, alignment] = Valyrian.translate(text, mode);
  out.textContent = translated;
  align.textContent = alignment;
  hint.textContent = "Direction: " + (mode === "en" ? "English -> High Valyrian" : "High Valyrian -> English") + (dir.value === "auto" ? " (auto)" : " (manual)");
};

const copyText = (t) => {
  const done = () => {
    copy.textContent = "Copied!";
    setTimeout(() => { copy.textContent = "Copy"; }, 1200);
  };
  const fallback = () => {
    const ta = document.createElement("textarea");
    ta.value = t;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); done(); } catch (e) {}
    document.body.removeChild(ta);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done).catch(fallback);
  else fallback();
};

src.oninput = run;
dir.onchange = run;
go.onclick = run;

swap.onclick = () => {
  if (out.textContent.length === 0) return;
  src.value = out.textContent;
  if (dir.value === "auto") dir.value = lastMode === "en" ? "hv" : "en";
  else dir.value = dir.value === "en" ? "hv" : "en";
  run();
};

copy.onclick = () => {
  if (out.textContent.length > 0) copyText(out.textContent);
};

clear.onclick = () => {
  src.value = "";
  run();
  src.focus();
};

buildDict();
buildPhrases();
buildForms();
src.value = "Valar dohaeris.";
run();

</script>
